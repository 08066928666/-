      const presetUniqueKey = (p) =>
        [
          p.categoryId || "",
          p.taisho1 || "",
          p.basho || "",
          p.bui || "",
          p.tani || "",
          Number(p.tanka || 0)

      const toPresetRecord = (row) => ({
        categoryId: row.categoryId || "misc",
        taisho1: String(row.taisho1 || "").trim(),
        basho: String(row.basho || "").trim(),
        bui: String(row.bui || "").trim(),
        tani: String(row.tani || "").trim(),
        tanka: Number(row.tanka || 0),
        koji_naiyo: String(row.koji_naiyo || "").trim(),
        biko1: String(row.biko1 || "").trim()
      });

      const mergePresetMaps = (...maps) => {
        const out = {};
        maps.forEach((m) => {
          Object.entries(m || {}).forEach(([categoryId, list]) => {
            if (!out[categoryId]) out[categoryId] = [];
            const known = new Set(out[categoryId].map((x) => presetUniqueKey(x)));
            (list || []).forEach((item) => {
              const rec = toPresetRecord(item);
              if (!rec.taisho1) return;
              const key = presetUniqueKey(rec);
              if (!known.has(key)) {
                out[categoryId].push(rec);
                known.add(key);
              }
            });
          });
        });
        return out;
      };

      const currency = (value) => Number(value || 0).toLocaleString("ja-JP");

      const normalizeWallpaperName = (value) =>
        String(value || "")
          .replace(/\(量産品\)|（量産品）|量産品/g, "")
          .replace(/クロス貼替え/g, "クロス貼替")

      /**
       * 与 exportIntoTemplate 使用的逻辑相同：壁纸按「場所」汇总天井/壁㎡，其它工种类按行输出。
       * 抽出为纯函数后，可脱离 模板.xlsx 用 XLSX 直接生成同结构見積書。
       */
      function buildTemplateRecordsFromRows(rows) {
        const grouped = [];
        rows.forEach((row) => {
          const key = `${row.koshu1_text || ""}__${row.koshu2_text || ""}`;
          let g = grouped.find((x) => x.key === key);
          if (!g) {
            g = {
              key,
              koshu1_text: row.koshu1_text || "",
              koshu2_text: row.koshu2_text || "",
              categoryId: row.categoryId,
              rows: []
            };
            grouped.push(g);
          }
          g.rows.push(row);
        });

        let sectionNo = 1;
        const out = [];

        grouped.forEach((g) => {
          const isWallpaper = g.categoryId === "wallpaper" || /クロス|壁紙|壁纸/.test(`${g.koshu1_text} ${g.koshu2_text}`);

          if (isWallpaper) {
            const totalSqm = g.rows.reduce((s, r) => s + Number(r.suryo || 0), 0);
            out.push({
              name: `${sectionNo}  ${g.koshu2_text || "クロス貼替工事"}`,
              basho: "",
              bui: "",
              qty: "",
              unit: "",
              unitPrice: "",
              amount: "",
              ownerRate: "",
              ownerCost: "",
              tenantRate: "",
              tenantCost: "",
              note: ""
            });
            out.push({
              name: "　　クロス貼替",
              basho: "",
              bui: "",
              qty: "",
              unit: "",
              unitPrice: "",
              amount: "",
              ownerRate: "",
              ownerCost: "",
              tenantRate: "",
              tenantCost: "",
              note: `総㎡  ${totalSqm.toFixed(1)}㎡`
            });
            out.push({
              name: "　【内訳】",
              basho: "天井",
              bui: "壁",
              qty: "",
              unit: "",
              unitPrice: "",
              amount: "",
              ownerRate: "",
              ownerCost: "",
              tenantRate: "",
              tenantCost: "",
              note: ""
            });

            const byBasho = {};
            g.rows.forEach((r) => {
              const place = r.basho || "その他";
              if (!byBasho[place]) byBasho[place] = { ceil: 0, wall: 0, unitPrice: 0, note: "" };
              const qty = Number(r.suryo || 0);
              if (/天井/.test(r.bui || "")) byBasho[place].ceil += qty;
              else byBasho[place].wall += qty;
              if (!byBasho[place].unitPrice) byBasho[place].unitPrice = Number(r.tanka || 0);
              if (!byBasho[place].note && r.biko1) byBasho[place].note = r.biko1;
            });

            Object.entries(byBasho).forEach(([place, v]) => {
              const sum = v.ceil + v.wall;
              out.push({
                name: `　　${place}`,
                basho: v.ceil ? String(v.ceil) : "",
                bui: v.wall ? String(v.wall) : "",
                qty: String(sum),
                unit: "㎡",
                unitPrice: v.unitPrice ? String(v.unitPrice) : "",
                amount: v.unitPrice ? String(Math.round(sum * v.unitPrice)) : "",
                ownerRate: "",
                ownerCost: "",
                tenantRate: "",
                tenantCost: "",
                note: v.note || ""
              });
            });
          } else {
            out.push({
              name: `${sectionNo}  ${g.koshu2_text || g.koshu1_text || "工事"}`,
              basho: "",
              bui: "",
              qty: "",
              unit: "",
              unitPrice: "",
              amount: "",
              ownerRate: "",
              ownerCost: "",
              tenantRate: "",
              tenantCost: "",
              note: ""
            });
            g.rows.forEach((r) => {
              out.push({
                name: r.taisho1 || r.koji_naiyo || "",
                basho: r.basho || "",
                bui: r.bui || "",
                qty: Number(r.suryo || 0),
                unit: r.tani || "",
                unitPrice: Number(r.tanka || 0),
                amount: Number(r.price || 0),
                ownerRate: Number(r.ownerRate || 0),
                ownerCost: Number(r.ownerCost || 0),
                tenantRate: Number(r.tenantRate || 0),

      function computeMitsumoriTotals(activeRows, costRules) {
        const totalPrice = activeRows.reduce((sum, row) => sum + Number(row.price || 0), 0);
        const ownerTotal = activeRows.reduce((sum, row) => sum + Number(row.ownerCost || 0), 0);
        const tenantTotal = activeRows.reduce((sum, row) => sum + Number(row.tenantCost || 0), 0);
        const overhead = Math.round((totalPrice * Number(costRules.overheadRate || 0)) / 100);
        const middleTotal = totalPrice + overhead;
        const discount = -(middleTotal % 1000);
        const quoteTotal = middleTotal + discount;
        const tax = Math.round((quoteTotal * Number(costRules.taxRate || 0)) / 100);
        const grandTotal = quoteTotal + tax;
        return { totalPrice, ownerTotal, tenantTotal, overhead, middleTotal, discount, quoteTotal, tax, grandTotal };
      }

      const COL_HASEKO = 9;

      const padHasekoRow = (cells) => {
        const r = Array.isArray(cells) ? [...cells] : [cells];
        while (r.length < COL_HASEKO) r.push("");
        return r.slice(0, COL_HASEKO);
      };

      const fmtM2 = (v) => {
        if (v === 0 || v === "" || v == null) return "";
        const n = Number(v);
        if (Number.isNaN(n) || n === 0) return "";
        if (Number.isInteger(n) || Math.abs(n - Math.round(n)) < 0.0001) return String(Math.round(n));
        const s = n.toFixed(1);
        return s.endsWith(".0") ? String(Math.round(n)) : s;
      };

      /**
       * 长谷工式クロス内訳：番号/名称(含工種) | 天井 | 壁 | 単位 | 数量 | 単価 | 合計 | 備考
       * 合計欄行可写字典 SP2519；内訳行 数量=天井+壁㎡。
       */
      function buildHasekoStyleDetailAoa(activeRows, projectInfo) {
        const grouped = [];
        activeRows.forEach((row) => {
          const key = `${row.koshu1_text || ""}__${row.koshu2_text || ""}`;
          let g = grouped.find((x) => x.key === key);
          if (!g) {
            g = {
              key,
              koshu1_text: row.koshu1_text || "",
              koshu2_text: row.koshu2_text || "",
              categoryId: row.categoryId,
              rows: []
            };
            grouped.push(g);
          }
          g.rows.push(row);
        });

        const spCode = (projectInfo.crossSpecCode && String(projectInfo.crossSpecCode).trim()) || "SP2519";
        const brTanka = Number(projectInfo.boardRepairTanka);
        const rows = [];
        let sectionNo = 1;

        grouped.forEach((g) => {
          const isWallpaper = g.categoryId === "wallpaper" || /クロス|壁紙|壁纸/.test(`${g.koshu1_text} ${g.koshu2_text}`);

          if (isWallpaper) {
            const totalSqm = g.rows.reduce((s, r) => s + Number(r.suryo || 0), 0);
            rows.push(
              padHasekoRow([String(sectionNo), "クロス貼替工事", "", "", "", "", "", spCode, ""])
            );
            rows.push(
              padHasekoRow([
                "",
                `クロス貼替  総m² ${totalSqm.toFixed(1)}m²`,
                "",
                "",
                "",
                "",
                "",
                "",
                ""
              ])
            );
            rows.push(padHasekoRow(["", "【内訳】", "天井", "壁", "", "", "", "", ""]));

            const byBasho = {};
            g.rows.forEach((r) => {
              const place = r.basho || "その他";
              if (!byBasho[place]) byBasho[place] = { ceil: 0, wall: 0, unitPrice: 0, note: "" };
              const q = Number(r.suryo || 0);
              if (/天井/.test(r.bui || "")) byBasho[place].ceil += q;
              else byBasho[place].wall += q;
              if (!byBasho[place].unitPrice) byBasho[place].unitPrice = Number(r.tanka || 0);
              if (!byBasho[place].note && r.biko1) byBasho[place].note = r.biko1;
            });

            Object.entries(byBasho).forEach(([place, v]) => {
              const sum = v.ceil + v.wall;
              const up = v.unitPrice || 0;
              const amt = up ? Math.round(sum * up) : "";
              rows.push(
                padHasekoRow([
                  "",
                  place,
                  fmtM2(v.ceil),
                  fmtM2(v.wall),
                  "㎡",
                  fmtM2(sum) || String(sum),
                  up || "",
                  amt,
                  v.note || ""
                ])
              );
            });

            if (Number.isFinite(brTanka) && brTanka > 0) {
              rows.push(
                padHasekoRow(["", "ボード補修＋下地処理", "", "", "式", 1, brTanka, brTanka, ""])
              );
            }
          } else {
            rows.push(
              padHasekoRow([
                String(sectionNo),
                `${g.koshu2_text || g.koshu1_text || "工事"}`,
                "",
                "",
                "",
                "",
                "",
                "",
                ""
              ])
            );
            g.rows.forEach((r) => {
              const pr = Number(r.tanka || 0);
              const qty = Number(r.suryo || 0);
              const amt = Number(r.price != null ? r.price : Math.round(qty * pr)) || 0;
              rows.push(
                padHasekoRow([
                  "",
                  r.taisho1 || r.koji_naiyo || "",
                  "",
                  "",
                  r.tani || "",
                  qty,
                  pr,
                  amt,
                  r.biko1 || ""
                ])
              );
            });
          }
          sectionNo += 1;
        });
        return rows;
      }

      function buildMitsumoriWorkbookAoA(projectInfo, costRules, activeRows) {
        const extraBoard = Number(projectInfo.boardRepairTanka) > 0 ? Number(projectInfo.boardRepairTanka) : 0;
        const rowsForTotal =
          extraBoard > 0
            ? [...activeRows, { price: extraBoard, ownerCost: extraBoard, tenantCost: 0, ownerRate: 100, tenantRate: 0 }]
            : activeRows;
        const t = computeMitsumoriTotals(rowsForTotal, costRules);
        const taxRateN = Number(costRules.taxRate || 0) / 100;

      function downloadMitsumoriXlsxFromAoA(aoa, fileName, options = {}) {
        if (typeof XLSX === "undefined" || !XLSX.utils) {
          throw new Error("XLSX 未加载，请检查 xlsx.full.min.js");
        }
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(aoa);
        if (options.merges && options.merges.length) {
          ws["!merges"] = options.merges;
        }
        ws["!cols"] = (options.cols && options.cols.length ? options.cols : [20, 14, 10, 10, 8, 8, 10, 12, 20]).map((c) =>
          typeof c === "number" ? { wch: c } : c
        );
        XLSX.utils.book_append_sheet(wb, ws, "見積書");
        const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
        const blob = new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
      }

      /**
       * 与 scripts/test-orderbook-data.mjs 中 tryParseChumonMeisaiUbix 同逻辑（AOA 输入）。
       * 列2=場所、13=天井㎡、17=壁㎡、40=単価、28=備考
       */
      function parseChumonMeisaiUbixAoa(aoa) {
        const out = [];
        const mk = (o) => {
          const p = Math.round(o.suryo * o.tanka);
          return { ...o, price: p, ownerRate: 100, ownerCost: p, tenantRate: 0, tenantCost: 0, koshu2_koban: "", taisho2: "", koji_naiyo: "", maker: "" };
        };
        let inCross = false;
        for (let i = 0; i < aoa.length; i++) {
          const r = aoa[i] || [];
          const c0 = r[0];
          const c2 = String(r[2] ?? "").trim();
          if ((c0 === 1 || String(c0) === "1") && c2 === "クロス") {
            inCross = true;
            continue;
          }
          if (inCross) {
            if ((c0 === 2 || String(c0) === "2") && /下地|補助/.test(c2)) {
              inCross = false;
              break;
            }
            if (c2.startsWith("※")) continue;
            if (c2.startsWith("アクセント")) {
              inCross = false;
              continue;
            }
          }
          if (!c2 || c2.length < 2) continue;
          const ce = Number(r[13]);
          const wa = Number(r[17]);
          const ta = Number(r[40]) || 0;
          if ((!Number.isFinite(ce) || ce <= 0) && (!Number.isFinite(wa) || wa <= 0)) continue;
          if (ta <= 0) continue;
          if (inCross) {
            if (ce > 0) out.push(mk({ categoryId: "wallpaper", koshu1_text: "通常工事", koshu2_text: "内装", taisho1: "ｸﾛｽ(注文明細)", basho: c2, bui: "天井", suryo: ce, tani: "㎡", tanka: ta, biko1: String(r[28] ?? "").slice(0, 40) }));
            if (wa > 0) out.push(mk({ categoryId: "wallpaper", koshu1_text: "通常工事", koshu2_text: "内装", taisho1: "ｸﾛｽ(注文明細)", basho: c2, bui: "壁", suryo: wa, tani: "㎡", tanka: ta, biko1: String(r[28] ?? "").slice(0, 40) }));
          }
        }
        return { ok: out.length > 0, count: out.length, rows: out, source: "chumon_注文明細" };
      }

          const rowIndex = visibleRows.findIndex((r) => r.id === rowId);

          if (event.key === "ArrowLeft") {
            event.preventDefault();
            if (fieldIndex > 0) focusCell(rowId, order[fieldIndex - 1]);
            return;
          }
          if (event.key === "ArrowRight") {
            event.preventDefault();
            if (fieldIndex < order.length - 1) focusCell(rowId, order[fieldIndex + 1]);
            return;
          }
          if (event.key === "ArrowUp") {
            event.preventDefault();
            if (rowIndex > 0) focusCell(visibleRows[rowIndex - 1].id, field);

          if (event.key === "ArrowDown") {

            if (rowIndex < visibleRows.length - 1) focusCell(visibleRows[rowIndex + 1].id, field);

          }
          if (event.key === "Enter") {
            event.preventDefault();
            if (fieldIndex < order.length - 1) {
              focusCell(rowId, order[fieldIndex + 1]);
              return;
            }
            const nextIndex = rowIndex + 1;
            if (nextIndex < visibleRows.length) {

          const onMove = (moveEvent) => {
            if (!resizingRef.current) return;

            const next = Math.max(56, resizingRef.current.startWidth + delta);
            setColumnWidths((prev) => ({ ...prev, [columnKey]: next }));
          };
          const onUp = () => {
            window.removeEventListener("mousemove", onMove);

          const matrix = raw
            .split(/\r?\n/)
            .map((line) => line.split("\t"))
            .filter((cols) => cols.some((c) => String(c).trim() !== ""));
          if (matrix.length === 0) return;
          event.preventDefault();

          const order = getRowCellOrder();
          const columnModeMap = {
            qty: "suryo",
            tanka: "tanka",
            biko: "biko1",
            name: "taisho1"
          };
          const modeField = pasteMode === "grid" ? field : (columnModeMap[pasteMode] || field);
          const startCol = order.indexOf(modeField);
          const visibleRows = rows.filter((r) => r.rowState !== "deleted");
          const startRowIndex = visibleRows.findIndex((r) => r.id === rowId);
          if (startCol < 0 || startRowIndex < 0) return;

          setRows((prev) => {
            const visibleIds = prev.filter((r) => r.rowState !== "deleted").map((r) => r.id);
            return prev.map((row) => {
              const vIdx = visibleIds.indexOf(row.id);
              if (vIdx < startRowIndex || vIdx >= startRowIndex + matrix.length) return row;
              const rOff = vIdx - startRowIndex;
              let next = { ...row };
              if (pasteMode === "grid") {
                matrix[rOff].forEach((cellValue, cOff) => {
                  const colField = order[startCol + cOff];
                  if (!colField) return;
                  const val = String(cellValue ?? "").trim();
                  if (colField === "taisho1" && next.categoryId === "wallpaper") next[colField] = normalizeWallpaperName(val);
                  else next[colField] = val;
                });
              } else {
                const cellValue = matrix[rOff]?.[0] ?? "";
                const val = String(cellValue).trim();
                if (modeField === "taisho1" && next.categoryId === "wallpaper") next[modeField] = normalizeWallpaperName(val);
                else next[modeField] = val;
              }
              const qty = Number(next.suryo || 0);
              const unitPrice = Number(next.tanka || 0);
              next.price = qty * unitPrice;
              if (next.rowState === "original") next.rowState = "modified";
              return next;
            });
          });
        };

        const scrollToSection = (sectionId) => {
          const el = document.getElementById(sectionId);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        };

        const jumpToError = (errorText) => {

          if (!m) return;

          if (!Number.isFinite(rowNumber) || rowNumber <= 0) return;
          const row = rows[rowNumber - 1];
          if (!row) return;
          scrollToSection("section-grid");
          setTimeout(() => {
            const tr = document.querySelector(`[data-row-id="${row.id}"]`);

        const activeRows = rows.filter((r) => r.rowState !== "deleted");

        const resetToBlank = () => {

        const getFieldValueFromDoc = (doc, field, idx) => {
          const el = doc.querySelector(`[name="${field}[${idx}]"]`);
          if (!el) return "";
          if (el.tagName === "SELECT") {
            return el.value || (el.options?.[el.selectedIndex]?.value ?? "");
          }
          return el.value ?? el.getAttribute("value") ?? "";
        };

        /** 与 scripts/run-haseko-sort-engine.mjs / haseko_quote_sort_engine.py 同构 */
        const KOUSHU2_META_ENGINE = {
          1: { label: "クロス工事" },
          2: { label: "床工事" },
          3: { label: "建具工事" },
          4: { label: "鋼製建具工事(廃止)" },
          5: { label: "クリーニング工事" },
          6: { label: "鍵工事" },
          7: { label: "和室工事" },
          8: { label: "塗装工事" },
          9: { label: "雑工事" },
          10: { label: "設備機器交換工事" },
          11: { label: "内装工事(廃止)" },
          12: { label: "必須工事" },
          13: { label: "固定工事" },
          14: { label: "設備点検(廃止)" },
          15: { label: "その他(廃止)" },
          16: { label: "交換工事" },
          17: { label: "アスベスト関連" }
        };
        const KOUSHU2_SORT_ORDER_ENGINE = [
          "1",
          "2",
          "3",
          "5",
          "6",
          "7",
          "8",
          "9",
          "10",
          "12",
          "13",
          "16",
          "17",
          "4",
          "11",
          "14",
          "15"
        ];

        const koushuSortKeyEngine = (cd) => {
          const i = KOUSHU2_SORT_ORDER_ENGINE.indexOf(cd);
          return i < 0 ? [999, cd] : [i, cd];
        };

        const decEngine = (s) => {
          const t = String(s ?? "")
            .trim()
            .replace(/[,，\s]/g, "");
          if (!t) return 0;
          const n = Number(t);
          return Number.isFinite(n) ? n : 0;
        };

        const COLMAP_ENGINE = {
          taisho1: "C",
          taisho2: "D",
          basho: "E",
          bui: "F",
          zumen_suryo: "G",
          suryo: "H",
          tani: "I",
          tanka: "J",
          kakaku: "K",
          koji_naiyo: "B"
        };

        const buildHasekoEnginePayload = (doc) => {
          const rowKbnEls = Array.from(doc.querySelectorAll('[name^="row_kbn["]'));
          const indexes = rowKbnEls
            .map((el) => {
              const m = el.getAttribute("name")?.match(/\[(\d+)\]/);
              return m ? Number(m[1]) : null;
            })
            .filter((v) => Number.isFinite(v))
            .sort((a, b) => a - b);

          const rawRows = [];
          for (const idx of indexes) {
            const row_kbn = getFieldValueFromDoc(doc, "row_kbn", idx);
            if (!row_kbn) continue;
            rawRows.push({
              row_index: idx,
              row_kbn,
              row_no: getFieldValueFromDoc(doc, "row_no", idx),
              koshu1_text: getFieldValueFromDoc(doc, "koshu1_text", idx),
              sel_koshu2_cd: getFieldValueFromDoc(doc, "sel_koshu2_cd", idx),
              koshu2_text: getFieldValueFromDoc(doc, "koshu2_text", idx),
              koshu2_cd: getFieldValueFromDoc(doc, "koshu2_cd", idx),
              kojikomoku_id: getFieldValueFromDoc(doc, "kojikomoku_id", idx),
              taisho1: getFieldValueFromDoc(doc, "taisho1", idx),
              taisho2: getFieldValueFromDoc(doc, "taisho2", idx),
              koji_naiyo: getFieldValueFromDoc(doc, "koji_naiyo", idx),
              basho: getFieldValueFromDoc(doc, "basho", idx),
              bui: getFieldValueFromDoc(doc, "bui", idx),
              zumen_suryo: getFieldValueFromDoc(doc, "zumen_suryo", idx),
              suryo: getFieldValueFromDoc(doc, "suryo", idx),
              tani: getFieldValueFromDoc(doc, "tani", idx),
              tanka: getFieldValueFromDoc(doc, "tanka", idx),
              kakaku: getFieldValueFromDoc(doc, "kakaku", idx),
              biko1: getFieldValueFromDoc(doc, "biko1", idx),
              comment: getFieldValueFromDoc(doc, "comment", idx)
            });
          }

          let currentKoshu1 = "";
          let currentKoshu2Cd = "";
          let currentKoshu2Text = "";
          let currentKoshu2CdHidden = "";
          const details = [];
          const comments = [];

          for (const r of rawRows) {
            if (r.row_kbn === "1") {
              currentKoshu1 = r.koshu1_text;
              continue;
            }
            if (r.row_kbn === "2") {
              currentKoshu2Text = r.koshu2_text;
              currentKoshu2CdHidden = r.koshu2_cd;
              currentKoshu2Cd = r.sel_koshu2_cd || r.koshu2_cd;
              continue;
            }
            if (r.row_kbn === "4") {
              if (r.comment.trim()) comments.push({ row_index: r.row_index, comment: r.comment.trim() });
              continue;
            }
            if (r.row_kbn !== "3") continue;

            const cd = r.sel_koshu2_cd || currentKoshu2Cd || currentKoshu2CdHidden || "0";
            const label = KOUSHU2_META_ENGINE[cd]?.label || `unknown(${cd})`;
            const fields = {
              koshu1_text: currentKoshu1,
              koshu2_text: currentKoshu2Text,
              koshu2_cd: currentKoshu2CdHidden,
              sel_koshu2_cd: cd,
              kojikomoku_id: String(r.kojikomoku_id || "").trim(),
              taisho1: r.taisho1,
              taisho2: r.taisho2,
              koji_naiyo: r.koji_naiyo,
              basho: r.basho,
              bui: r.bui,
              zumen_suryo: r.zumen_suryo,
              suryo: r.suryo,
              tani: r.tani,
              tanka: r.tanka,
              kakaku: r.kakaku,
              biko1: r.biko1
            };
            details.push({
              bucket_cd: cd,
              bucket_label: label,
              source_row_index: r.row_index,
              row_no: r.row_no,
              kojikomoku_id: fields.kojikomoku_id,
              fields
            });
          }

          const sorted = [...details].sort((a, b) => {
            const [ia, sa] = koushuSortKeyEngine(a.bucket_cd);
            const [ib, sb] = koushuSortKeyEngine(b.bucket_cd);
            if (ia !== ib) return ia - ib;
            if (sa !== sb) return sa.localeCompare(sb);
            return a.source_row_index - b.source_row_index;
          });

          const startRow = 15;
          const koumoku_rows = sorted.map((d, i) => {
            const rnum = startRow + i;
            const cells = {};
            for (const [fname, col] of Object.entries(COLMAP_ENGINE)) {
              const val = d.fields[fname] ?? "";
              cells[`${col}${rnum}`] = String(val).trim();
            }
            return {
              logical_row: i + 1,
              excel_data_row: rnum,
              bucket_cd: d.bucket_cd,
              kojikomoku_id: d.kojikomoku_id,
              cells,
              raw_fields: d.fields
            };
          });

          let subtotal = 0;
          const moneyLines = [];
          for (const d of sorted) {
            const suryo = decEngine(d.fields.suryo);
            const tanka = decEngine(d.fields.tanka);
            let kakaku = decEngine(d.fields.kakaku);
            if (!kakaku && suryo && tanka) kakaku = Math.round(suryo * tanka);
            subtotal += kakaku;
            moneyLines.push({ bucket_cd: d.bucket_cd, kojikomoku_id: d.kojikomoku_id, amount: String(kakaku) });
          }
          const six = Math.round(subtotal * 0.06);
          const tenBase = subtotal + six;
          const ten = Math.round(tenBase * 0.1);

          return {
            meta: {
              engine: "browser Haseko sort engine (parity with scripts/run-haseko-sort-engine.mjs)",
              excel_column_map_hypothesis: COLMAP_ENGINE,
              data_start_row_hypothesis: startRow
            },
            koumoku_rows,
            money: {
              subtotal_construction: String(subtotal),
              suggested_shokeihi_6pct: String(six),
              suggested_taxable_before_10pct: String(tenBase),
              suggested_consumption_tax_10pct: String(ten),
              lines: moneyLines
            },
            parse: {
              raw_row_count: rawRows.length,
              detail_count: sorted.length,
              comments
            },
            raw_rows_debug: rawRows.slice(0, 40)
          };
        };

        const runHasekoEngineOnSelectedHtml = async () => {
          if (!historyHtmlFile) {
            setExportStatus("请先选择上面的见积登录 HTML 文件。");
            return;
          }
          try {
            const text = await historyHtmlFile.text();
            const doc = new DOMParser().parseFromString(text, "text/html");
            const payload = buildHasekoEnginePayload(doc);
            setEnginePayload(payload);
            setEngineResultText(JSON.stringify(payload, null, 2));
            setEngineSummary({
              raw: payload.parse.raw_row_count,
              details: payload.parse.detail_count,
              subtotal: payload.money.subtotal_construction,
              shokeihi: payload.money.suggested_shokeihi_6pct,
              tax: payload.money.suggested_consumption_tax_10pct
            });
            setExportStatus(`分拣引擎：${payload.parse.detail_count} 条明細 · 小计 ¥${payload.money.subtotal_construction}（结果在下方）`);
            document.getElementById("section-haseko-engine")?.scrollIntoView({ behavior: "smooth", block: "start" });
          } catch (e) {
            setExportStatus(`分拣引擎失败：${e.message}`);
          }
        };

        const downloadEngineJson = () => {
          if (!engineResultText) return;
          const blob = new Blob([engineResultText], { type: "application/json;charset=utf-8" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "koumoku_engine_result.json";
          a.click();
          URL.revokeObjectURL(a.href);
        };

        const inferCategoryByKoshu = (koshu1Text, koshu2Text, taisho1) => {
          const sourceText = [koshu1Text, koshu2Text, taisho1].filter(Boolean).join(" ");
          const match = CATEGORY_DEFS.find((c) =>
            [c.label, c.koshu1_text, c.koshu2_text].some((k) => sourceText.includes(k) || k.includes(sourceText))
          );
          if (match) return match.id;
          if (/クロス|壁纸|壁/.test(sourceText)) return "wallpaper";
          if (/設備|便座|水栓|換気|エアコン/.test(sourceText)) return "equipment";
          if (/クリーニング|清掃/.test(sourceText)) return "cleaning";
          if (/鍵/.test(sourceText)) return "security";
          return "misc";
        };

        const importHistoryHtml = async () => {
          if (!historyHtmlFile) {
            setExportStatus("请先选择历史見積登録 HTML 文件。");
            return;
          }
          try {
            const text = await historyHtmlFile.text();
            const doc = new DOMParser().parseFromString(text, "text/html");
            const rowKbnEls = Array.from(doc.querySelectorAll('[name^="row_kbn["]'));
            const indexes = rowKbnEls
              .map((el) => {
                const m = el.getAttribute("name")?.match(/\[(\d+)\]/);
                return m ? Number(m[1]) : null;
              })
              .filter((v) => Number.isFinite(v))
              .sort((a, b) => a - b);

            let currentKoshu1 = "";
            let currentKoshu2 = "";
            let currentSelKoshu2Cd = "";
            const importedRows = [];
            const comments = [];

            indexes.forEach((idx) => {
              const rowKbn = getFieldValueFromDoc(doc, "row_kbn", idx);
              if (rowKbn === "1") {
                currentKoshu1 = getFieldValueFromDoc(doc, "koshu1_text", idx);
                return;
              }
              if (rowKbn === "2") {
                currentKoshu2 = getFieldValueFromDoc(doc, "koshu2_text", idx);
                currentSelKoshu2Cd = getFieldValueFromDoc(doc, "sel_koshu2_cd", idx);
                return;
              }
              if (rowKbn === "4") {
                const c = getFieldValueFromDoc(doc, "comment", idx);
                if (c && c.trim()) comments.push(c.trim());
                return;
              }
              if (rowKbn !== "3") return;

              const taisho1 = getFieldValueFromDoc(doc, "taisho1", idx);
              const categoryId = inferCategoryByKoshu(currentKoshu1, currentKoshu2, taisho1);
              const category = CATEGORY_DEFS.find((c) => c.id === categoryId) || CATEGORY_DEFS[0];

              const suryo = Number(getFieldValueFromDoc(doc, "suryo", idx) || 0);
              const tanka = Number(getFieldValueFromDoc(doc, "tanka", idx) || 0);
              const kakaku = Number(getFieldValueFromDoc(doc, "kakaku", idx) || Math.round(suryo * tanka));
              const ownerRate = Number(getFieldValueFromDoc(doc, "kashinushi_futan_wariai", idx) || 0);
              const ownerCost = Number(getFieldValueFromDoc(doc, "kashinushi_futan_kingaku", idx) || 0);
              const tenantRate = Number(getFieldValueFromDoc(doc, "karinushi_futan_wariai", idx) || 0);
              const tenantCost = Number(getFieldValueFromDoc(doc, "karinushi_futan_kingaku", idx) || 0);

              importedRows.push({
                id: crypto.randomUUID(),
                categoryId: category.id,
                koshu1_text: currentKoshu1 || category.koshu1_text,
                koshu2_text: currentKoshu2 || category.koshu2_text,
                koshu2_koban: "",
                sel_koshu2_cd: currentSelKoshu2Cd || category.sel_koshu2_cd,
                taisho1: category.id === "wallpaper" ? normalizeWallpaperName(taisho1) : taisho1,
                taisho2: getFieldValueFromDoc(doc, "taisho2", idx),
                koji_naiyo: getFieldValueFromDoc(doc, "koji_naiyo", idx),
                basho: getFieldValueFromDoc(doc, "basho", idx),
                bui: getFieldValueFromDoc(doc, "bui", idx),
                zumen_suryo: getFieldValueFromDoc(doc, "zumen_suryo", idx),
                suryo,
                tani: getFieldValueFromDoc(doc, "tani", idx),
                tanka,
                price: kakaku,
                ownerRate,
                tenantRate,
                ownerCost,
                tenantCost,
                biko1: getFieldValueFromDoc(doc, "biko1", idx),
                maker: getFieldValueFromDoc(doc, "maker", idx),
                type: getFieldValueFromDoc(doc, "type", idx),
                comment: "",
                rowState: "original",
                source: "history-html"
              });
            });

            setRows(importedRows);
            if (comments.length > 0) {
              setProjectInfo((prev) => ({
                ...prev,
                memo: prev.memo ? `${prev.memo}\n${comments.join("\n")}` : comments.join("\n")
              }));

            upsertCustomPresetsFromRows(importedRows);

            setTimeout(() => scrollToSection("section-grid"), 80);
            setExportStatus(`历史HTML：已导入 ${importedRows.length} 条（备注 +${comments.length}）。已滚到明細。`);
          } catch (e) {
            setExportStatus(`历史HTML导入失败：${e.message}`);
          }

        const importChumonMeisai = async () => {
          if (!chumonXlsxFile) {
            setExportStatus("请先选择注文明細 .xlsx 文件。");
            return;
          }
          try {

            if (typeof XLSX === "undefined" || !XLSX.read) {
              throw new Error("XLSX 未加载");
            }
            const wb = XLSX.read(buf, { type: "array", cellDates: true, raw: false });
            const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
            const { ok, rows: rawRows } = parseChumonMeisaiUbixAoa(aoa);
            if (!ok || !rawRows.length) {
              setExportStatus("未从注文明細中解析到クロス张替行：请确认版式为ユービックス（列2/13/17/40）且含「1」「クロス」块。");
              return;
            }
            const category = CATEGORY_DEFS.find((c) => c.id === "wallpaper") || CATEGORY_DEFS[0];
            const importedRows = rawRows.map((r) => ({
              id: crypto.randomUUID(),
              categoryId: r.categoryId,
              koshu1_text: r.koshu1_text,
              koshu2_text: r.koshu2_text,
              koshu2_koban: r.koshu2_koban || "",
              sel_koshu2_cd: category.sel_koshu2_cd,
              taisho1: normalizeWallpaperName(r.taisho1),
              taisho2: "",
              koji_naiyo: r.koji_naiyo || "",
              basho: r.basho,
              bui: r.bui,
              zumen_suryo: "",
              suryo: r.suryo,
              tani: r.tani,
              tanka: r.tanka,
              price: r.price,
              ownerRate: r.ownerRate,
              tenantRate: r.tenantRate,
              ownerCost: r.ownerCost,
              tenantCost: r.tenantCost,
              biko1: r.biko1,
              maker: r.maker || "",
              type: "",
              comment: "",
              rowState: "new",
              source: "chumon-ubix"
            }));
            setRows(importedRows);
            upsertCustomPresetsFromRows(importedRows);
            setDataSourceMode("history");
            setTimeout(() => scrollToSection("section-grid"), 80);
            setExportStatus(`注文明細导入成功：${importedRows.length} 条明细。顶栏可生成見積xlsx 或下滚查看プレビュー。`);
          } catch (e) {
            setExportStatus(`注文明細导入失败：${e.message}`);
          }
        };

        const subtotalMap = activeRows.reduce((acc, row) => {
          acc[row.categoryId] = (acc[row.categoryId] || 0) + Number(row.price || 0);
          return acc;
        }, {});

        const totalPrice = activeRows.reduce((sum, row) => sum + Number(row.price || 0), 0);
        const ownerTotal = activeRows.reduce((sum, row) => sum + Number(row.ownerCost || 0), 0);
        const tenantTotal = activeRows.reduce((sum, row) => sum + Number(row.tenantCost || 0), 0);
        const overhead = Math.round((totalPrice * Number(costRules.overheadRate || 0)) / 100);
        const middleTotal = totalPrice + overhead;
        const discount = -(middleTotal % 1000);
        const quoteTotal = middleTotal + discount;
        const tax = Math.round((quoteTotal * Number(costRules.taxRate || 0)) / 100);
        const grandTotal = quoteTotal + tax;
        const groupedForSheet = CATEGORY_DEFS.map((cat) => ({
          ...cat,
          rows: activeRows.filter((r) => r.categoryId === cat.id)
        })).filter((g) => g.rows.length > 0);
        const hasekoPaperRows = buildHasekoStyleDetailAoa(activeRows, projectInfo);
        const crossStartIdx = hasekoPaperRows.findIndex((r) => /クロス貼替工事/.test(String(r?.[1] || "")));
        const crossDetailRows =
          crossStartIdx >= 0
            ? hasekoPaperRows
                .slice(crossStartIdx, crossStartIdx + 40)
                .filter((r, i) => i === 0 || String(r?.[1] || "").trim() !== "")
            : [];

        const gridUi = {
          compact: {
            tableMinWidth: "min-w-[1300px]",
            thPad: "p-1",
            tdPad: "p-1",
            inputH: "h-7",
            textSize: "text-sm"
          },
          standard: {
            tableMinWidth: "min-w-[1400px]",
            thPad: "p-1.5",
            tdPad: "p-1.5",
            inputH: "h-8",
            textSize: "text-base"
          },
          roomy: {
            tableMinWidth: "min-w-[1500px]",
            thPad: "p-2",
            tdPad: "p-2",
            inputH: "h-10",
            textSize: "text-base"
          }
        }[gridDensity];

        const buildExportRows = () => {
          const grouped = activeRows.reduce((acc, row) => {
            if (!acc[row.categoryId]) acc[row.categoryId] = [];
            acc[row.categoryId].push(row);
            return acc;
          }, {});

          const output = [];
          Object.entries(grouped).forEach(([categoryId, groupRows]) => {
            const def = CATEGORY_DEFS.find((c) => c.id === categoryId);
            output.push({
              row_kbn: "1",
              koshu1_text: def.koshu1_text
            });
            output.push({
              row_kbn: "2",
              koshu2_koban: "",
              sel_koshu2_cd: def.sel_koshu2_cd,
              koshu2_text: def.koshu2_text
            });
            groupRows.forEach((r) => {
              const meisai = {
                row_kbn: "3",
                taisho1: r.taisho1,
                taisho2: r.taisho2,
                koji_naiyo: r.koji_naiyo,
                basho: r.basho,
                bui: r.bui,
                zumen_suryo: r.zumen_suryo,
                suryo: String(r.suryo),
                tani: r.tani,
                tanka: String(r.tanka),
                kakaku: String(r.price),
                kashinushi_futan_wariai: Number(r.ownerRate || 0).toFixed(2),
                kashinushi_futan_kingaku: String(r.ownerCost || 0),
                karinushi_futan_wariai: Number(r.tenantRate || 0).toFixed(2),
                karinushi_futan_kingaku: String(r.tenantCost || 0),
                biko1: r.biko1,
                maker: r.maker,
                type: r.type,
                comment: r.comment
              };
              output.push(meisai);
              if (r.comment && String(r.comment).trim()) {
                output.push({
                  row_kbn: "4",
                  comment: String(r.comment).trim()
                });
              }
            });
          });
          return output;
        };

        const validateExportRows = (dataRows) => {
          const errors = [];
          dataRows.forEach((row, index) => {
            const rowNo = index + 1;
            if (!row.row_kbn) {
              errors.push(`第${rowNo}行缺少 row_kbn`);
              return;
            }
            if (row.row_kbn === "1" && !row.koshu1_text) errors.push(`第${rowNo}行(row_kbn=1)缺少 koshu1_text`);
            if (row.row_kbn === "2" && !row.koshu2_text) errors.push(`第${rowNo}行(row_kbn=2)缺少 koshu2_text`);
            if (row.row_kbn === "3") {
              ["taisho1", "suryo", "tani", "tanka", "kakaku"].forEach((key) => {
                if (row[key] === undefined || row[key] === null || String(row[key]).trim() === "") {
                  errors.push(`第${rowNo}行(row_kbn=3)缺少 ${key}`);
                }
              });
            }
            if (row.row_kbn === "4" && (!row.comment || !String(row.comment).trim())) {
              errors.push(`第${rowNo}行(row_kbn=4)缺少 comment`);
            }
          });
          return errors;
        };

        const exportValidationReport = () => {
          const exportRows = buildExportRows();
          const errors = validateExportRows(exportRows);
          const report = {
            generatedAt: new Date().toISOString(),
            summary: {
              totalRows: exportRows.length,
              errorCount: errors.length,
              status: errors.length ? "failed" : "passed"
            },
            errors,
            previewRows: exportRows.slice(0, 30)
          };
          setValidationErrors(errors);
          setExportStatus(errors.length ? `自检完成：发现 ${errors.length} 个问题` : "自检通过：未发现字段问题");
          download(`${buildProjectFileBaseName()}_validation_report.json`, JSON.stringify(report, null, 2), "application/json");
        };

        const download = (name, content, mime) => {
          const blob = new Blob([content], { type: mime });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = name;
          a.click();
          URL.revokeObjectURL(url);
        };

        const sanitizeFileName = (name) => String(name || "").replace(/[\\/:*?"<>|]/g, "_").trim();

        const buildProjectFileBaseName = () => {
          const base = [projectInfo.estateName, projectInfo.roomNo, projectInfo.workTitle]
            .map((v) => String(v || "").trim())
            .filter(Boolean)
            .join(" ");
          return sanitizeFileName(base || "見積書");
        };

        const exportJson = () => {
          const exportRows = buildExportRows();
          const errors = validateExportRows(exportRows);
          if (errors.length) {
            setValidationErrors(errors);
            setExportStatus(`导出失败：${errors[0]}（共${errors.length}个问题）`);
            return;
          }
          const payload = {
            version: "1.0",
            meta: {
              quoteNo: projectInfo.quoteNo || "",
              mitsumori_name: projectInfo.workTitle || "",
              mitsumori_bi: projectInfo.createdAt || ""
            },
            rows: exportRows,
            totals: {
              keihi_wariai: String(costRules.overheadRate ?? ""),
              nebiki_kbn: "3",
              nebiki_chi: String(Math.abs(discount))
            }
          };
          setValidationErrors([]);
          setExportStatus(`导出成功：${payload.rows.length} 行`);
          download(`${buildProjectFileBaseName()}.json`, JSON.stringify(payload, null, 2), "application/json");
        };

        const exportTsv = () => {
          const data = buildExportRows();
          const errors = validateExportRows(data);
          if (errors.length) {
            setValidationErrors(errors);
            setExportStatus(`导出失败：${errors[0]}（共${errors.length}个问题）`);
            return;
          }
          const lines = [
            EXPORT_HEADERS.join("\t"),
            ...data.map((row) => EXPORT_HEADERS.map((key) => row[key] ?? "").join("\t"))
          ];
          setValidationErrors([]);
          setExportStatus(`导出成功：${data.length} 行`);
          download(`${buildProjectFileBaseName()}.tsv`, lines.join("\n"), "text/tab-separated-values;charset=utf-8");
        };

        const exportPreviewExcel = async () => {
          // Keep 見積書Excel output identical to the user's template format.
          await exportIntoTemplate();
        };

        const findFirstBlankRow = (sheet, startRow, checkColumnNumber) => {
          let row = startRow;
          while (row < startRow + 3000) {
            const val = sheet.cell(row, checkColumnNumber).value();
            if (val === null || val === undefined || String(val).trim() === "") return row;
            row += 1;
          }
          return startRow;
        };

        const buildBackendStyledTemplateRecords = () => buildTemplateRecordsFromRows(activeRows);

        const exportMitsumoriXlsxNoTemplate = () => {
          try {
            if (typeof XLSX === "undefined") {
              setExportStatus("XLSX 未加载，无法无模板生成。");
              return;
            }
            const name = `${sanitizeFileName(buildProjectFileBaseName())}_見積書.xlsx`;
            const pack = buildMitsumoriWorkbookAoA(projectInfo, costRules, activeRows);
            downloadMitsumoriXlsxFromAoA(pack.aoa, name, { merges: pack.merges, cols: pack.cols });
            setExportStatus(`已生成長谷工式内訳見積：${name}（列区标签+天井/壁+合計欄品番可配）`);
          } catch (e) {
            setExportStatus(`无模板生成失败：${e.message || e}`);
          }
        };

        /**
         * 与「后端导出」同构：把分拣引擎产出的 cells（B–K 推断映射）写入模板。
         * 优先工作表名「項目」，否则第 1 张表。若列错位请改 buildHasekoEnginePayload 内 COLMAP_ENGINE。
         */
        const exportEnginePayloadIntoTemplate = async () => {
          if (!templateFile) {
            setTemplateStatus(`请先选择固定模板文件：${REQUIRED_TEMPLATE_NAME}`);
            return;
          }
          if (templateFile.name !== REQUIRED_TEMPLATE_NAME) {
            setTemplateStatus(`模板文件名必须是 ${REQUIRED_TEMPLATE_NAME}，当前为 ${templateFile.name}`);
            return;
          }
          if (!enginePayload?.koumoku_rows?.length) {
            setTemplateStatus("请先在上方选择 HTML 并点「网页执行分拣」。");
            return;
          }
          if (!window.XlsxPopulate) {
            setTemplateStatus("模板引擎未加载，请刷新页面后重试。");
            return;
          }
          try {
            setTemplateStatus("正在把分拣结果写入模板（項目表）…");
            const data = await templateFile.arrayBuffer();
            const workbook = await window.XlsxPopulate.fromDataAsync(data);
            let sheet = null;
            try {
              sheet = workbook.sheet("項目");
            } catch {
              /* ignore */
            }
            if (!sheet) sheet = workbook.sheet(0);
            if (!sheet) {
              setTemplateStatus("模板无可用工作表。");
              return;
            }
            const setCellValue = (addr, val) => {
              const s = String(val ?? "").trim();
              const m = /^([A-Z]{1,3})(\d+)$/i.exec(addr);
              if (!m) return;
              const letters = m[1].toUpperCase();
              /** 与 COLMAP 一致：G 図面数量、H 数量、J 単価、K 金額 → 尽量写入数值型 */
              const isNumericCol = letters === "G" || letters === "H" || letters === "J" || letters === "K";
              let write = s;
              if (isNumericCol && s !== "") {
                const n = Number(s.replace(/,/g, ""));
                if (Number.isFinite(n)) write = n;
              }
              sheet.cell(addr).value(write);
            };
            let cellCount = 0;
            enginePayload.koumoku_rows.forEach((row) => {
              Object.entries(row.cells).forEach(([addr, val]) => {
                setCellValue(addr, val);
                cellCount += 1;
              });
            });
            const blob = await workbook.outputAsync();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${buildProjectFileBaseName()}_項目灌入.xlsx`;
            a.click();
            URL.revokeObjectURL(url);
            setTemplateStatus(
              `已写入分拣引擎 ${enginePayload.koumoku_rows.length} 行、共 ${cellCount} 个单元格（优先表「項目」）。御見積書若含 =項目!… 公式会随动。`
            );
          } catch (error) {
            setTemplateStatus(`分拣灌模板失败: ${error.message}`);
          }
        };

        const exportIntoTemplate = async () => {
          if (!templateFile) {
            setTemplateStatus(`请先选择固定模板文件：${REQUIRED_TEMPLATE_NAME}`);
            return;
          }
          if (templateFile.name !== REQUIRED_TEMPLATE_NAME) {
            setTemplateStatus(`模板文件名必须是 ${REQUIRED_TEMPLATE_NAME}，当前为 ${templateFile.name}`);
            return;
          }
          if (!window.XlsxPopulate) {
            setTemplateStatus("模板引擎未加载，请刷新页面后重试。");
            return;
          }
          try {
            setTemplateStatus("正在填充模板...");
            const data = await templateFile.arrayBuffer();
            const workbook = await window.XlsxPopulate.fromDataAsync(data);
            const sheet = workbook.sheet(0);
            if (!sheet) {
              setTemplateStatus("模板无可用工作表。");
              return;
            }

            const records = buildBackendStyledTemplateRecords();

            const rowStart = findFirstBlankRow(sheet, TEMPLATE_START_ROW, 1);
            records.forEach((record, idx) => {
              const rowNo = rowStart + idx;
              sheet.cell(rowNo, 1).value(record.name);
              sheet.cell(rowNo, 2).value(record.basho);
              sheet.cell(rowNo, 3).value(record.bui);
              sheet.cell(rowNo, 4).value(record.qty);
              sheet.cell(rowNo, 5).value(record.unit);
              sheet.cell(rowNo, 6).value(record.unitPrice);
              sheet.cell(rowNo, 7).value(record.amount);
              sheet.cell(rowNo, 8).value(record.ownerRate);
              sheet.cell(rowNo, 9).value(record.ownerCost);
              sheet.cell(rowNo, 10).value(record.tenantRate);
              sheet.cell(rowNo, 11).value(record.tenantCost);
              sheet.cell(rowNo, 12).value(record.note);
            });

            const blob = await workbook.outputAsync();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${buildProjectFileBaseName()}.xlsx`;
            a.click();
            URL.revokeObjectURL(url);
            setTemplateStatus(`已写入 ${records.length} 条到模板空白行（起始行: ${rowStart}）。`);
          } catch (error) {
            setTemplateStatus(`导出失败: ${error.message}`);
          }
        };

        return (
          <div className="min-h-screen bg-zinc-50 pb-10">
            <div className="no-print sticky top-0 z-50 border-b border-zinc-200 bg-white/95 backdrop-blur">
              <div className="mx-auto flex max-w-[1800px] flex-wrap items-center gap-2 px-4 py-2.5 sm:px-5">
                <div className="mr-auto min-w-[220px]">
                  <h1 className="text-sm font-semibold text-zinc-900">見積作成</h1>
                  <p className="text-xs text-zinc-500">
                    {activeRows.length} 行 · 税込 <span className="font-semibold tabular-nums text-zinc-900">{currency(grandTotal)}</span> 円
                  </p>
                </div>
                <button type="button" onClick={() => scrollToSection("section-import")} className={uix.btnNav}>取込</button>
                <button type="button" onClick={() => scrollToSection("section-grid")} className={uix.btnNav}>明細</button>
                <button type="button" onClick={() => scrollToSection("section-preview")} className={uix.btnNav}>確認</button>
                <button type="button" onClick={() => window.print()} className={uix.btnLine}>PDF</button>
                <button type="button" onClick={exportMitsumoriXlsxNoTemplate} className={uix.btnMain}>生成xlsx</button>
              </div>
            </div>

            <div className="mx-auto max-w-[1800px] space-y-4 px-4 py-4 sm:space-y-5 sm:px-5 sm:py-5">
              <header className={`no-print overflow-hidden ${uix.card}`}>
                <div className="flex items-center justify-between gap-2 border-b border-zinc-100/90 bg-zinc-50/50 px-4 py-3">
                  <div>
                    <h2 className="text-sm font-semibold text-zinc-900">案件信息</h2>
                    <p className={uix.kicker}>见积抬头与税率（折叠后仍可快速改常用项）</p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setProjectInfoExpanded((v) => !v)}
                    className="shrink-0 rounded-lg px-2.5 py-1.5 text-sm font-medium text-violet-700 transition hover:bg-violet-50"
                  >
                    {projectInfoExpanded ? "收起" : "展开更多"}
                  </button>
                </div>
                {!projectInfoExpanded ? (
                  <div className="grid grid-cols-1 gap-2.5 p-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6">
                    <input className={uix.in} value={projectInfo.quoteNo} onChange={(e) => updateProjectInfo("quoteNo", e.target.value)} placeholder="見積No." />
                    <input className={uix.in} value={projectInfo.estateName} onChange={(e) => updateProjectInfo("estateName", e.target.value)} placeholder="物件名" />
                    <input className={uix.in} value={projectInfo.roomNo} onChange={(e) => updateProjectInfo("roomNo", e.target.value)} placeholder="号室" />
                    <input className={uix.in} value={projectInfo.workTitle} onChange={(e) => updateProjectInfo("workTitle", e.target.value)} placeholder="工事名称" />
                    <input className={uix.in} value={costRules.overheadRate} onChange={(e) => setCostRules((prev) => ({ ...prev, overheadRate: e.target.value }))} placeholder="諸経費率(%)" />
                    <input className={uix.in} value={costRules.taxRate} onChange={(e) => setCostRules((prev) => ({ ...prev, taxRate: e.target.value }))} placeholder="税率(%)" />
                  </div>
                ) : (
                  <div className="p-4">
                    <div className={`mb-2 ${uix.hLabel}`}>全字段</div>
                    <div className="grid grid-cols-1 gap-2.5 md:grid-cols-2 xl:grid-cols-3">
                      <input className={uix.in} value={projectInfo.quoteNo} onChange={(e) => updateProjectInfo("quoteNo", e.target.value)} placeholder="見積No." />
                      <input className={uix.in} value={projectInfo.estateName} onChange={(e) => updateProjectInfo("estateName", e.target.value)} placeholder="物件名" />
                      <input className={uix.in} value={projectInfo.roomNo} onChange={(e) => updateProjectInfo("roomNo", e.target.value)} placeholder="号室" />
                      <input className={uix.in} value={projectInfo.workTitle} onChange={(e) => updateProjectInfo("workTitle", e.target.value)} placeholder="工事名称" />
                      <input className={uix.in} type="date" value={projectInfo.createdAt} onChange={(e) => updateProjectInfo("createdAt", e.target.value)} />
                      <input className={uix.in} value={projectInfo.memo} onChange={(e) => updateProjectInfo("memo", e.target.value)} placeholder="備考（案件）" />
                      <input className={uix.in} type="date" value={projectInfo.revisedAt} onChange={(e) => updateProjectInfo("revisedAt", e.target.value)} placeholder="再見積日" />
                      <input className={uix.in} value={projectInfo.tantosha} onChange={(e) => updateProjectInfo("tantosha", e.target.value)} placeholder="担当者" />
                      <input
                        className={uix.in}
                        value={projectInfo.crossSpecCode}
                        onChange={(e) => updateProjectInfo("crossSpecCode", e.target.value)}
                        placeholder="クロス合計欄品番 (例: SP2519)"
                        title="无模板xlsx 中「クロス貼替工事」行の合計列に出すコード"
                      />
                      <input
                        className={uix.in}
                        value={projectInfo.boardRepairTanka}
                        onChange={(e) => updateProjectInfo("boardRepairTanka", e.target.value)}
                        placeholder="ボード補修+下地 単価(円) 空=出さない"
                        title="空以外でクロス欄の末尾に 式×1 行を追記"
                      />
                      <input className={uix.in} value={costRules.overheadRate} onChange={(e) => setCostRules((prev) => ({ ...prev, overheadRate: e.target.value }))} placeholder="諸経費率(%)" />
                      <input className={uix.in} value={costRules.taxRate} onChange={(e) => setCostRules((prev) => ({ ...prev, taxRate: e.target.value }))} placeholder="税率(%)" />
                    </div>
                  </div>
                )}
              </header>

              <section id="section-import" className={`no-print scroll-mt-36 space-y-3 ${uix.card} p-4 sm:p-5`}>
                <div className="flex items-center gap-2">
                  <span className="flex h-7 w-7 items-center justify-center rounded-lg bg-violet-100 text-xs font-bold text-violet-700">1</span>
                  <div>
                    <h2 className="text-sm font-semibold text-zinc-900">数据来源</h2>
                    <p className="text-xs text-zinc-500">预设或文件导入，结果与明細、プレビュー同页联动</p>
                  </div>
                </div>
                <div className="grid grid-cols-1 gap-3 lg:grid-cols-2">
                  <div className="rounded-xl border border-zinc-200/70 bg-zinc-50/50 p-4">
                    <div className={`mb-3 ${uix.hLabel}`}>快速开始</div>
                    <div className="flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:items-center">
                      <button
                        onClick={resetToBlank}
                        className={
                          dataSourceMode === "blank"
                            ? `${uix.btnDark} px-3`
                            : `${uix.btnLine} px-3 font-semibold text-zinc-700`
                        }
                      >
                        新建空白
                      </button>
                      <div className="flex min-w-0 flex-1 flex-col gap-2 sm:max-w-md sm:flex-row sm:items-stretch">
                        <select
                          value={selectedPresetId}
                          onChange={(e) => setSelectedPresetId(e.target.value)}
                          className={`${uix.in} !py-2 text-sm`}
                        >
                          <option value="">选择历史見積書预设</option>
                          {HISTORICAL_PRESETS.map((p) => (
                            <option key={p.id} value={p.id}>
                              {p.label}
                            </option>
                          ))}
                        </select>
                        <button onClick={loadHistoryPreset} className={`shrink-0 ${uix.btnLine} border-emerald-200/80 bg-emerald-50/80 text-emerald-900 hover:bg-emerald-100/80`}>
                          载入
                        </button>
                      </div>
                    </div>
                    <p className="mt-3 text-xs text-zinc-500">状态：{dataSourceMode === "history" ? "已载入 / 已导入" : "空白"}</p>
                  </div>
                  <div className="rounded-xl border border-violet-200/60 bg-gradient-to-b from-violet-50/80 to-white p-4">
                    <div className={`mb-3 text-xs font-semibold text-violet-900`}>从文件</div>
                    <div className="space-y-3">
                      <div className="flex flex-col gap-2 sm:flex-row sm:items-center">
                        <input type="file" accept=".html,.htm" onChange={(e) => setHistoryHtmlFile(e.target.files?.[0] || null)} className="min-w-0 flex-1 text-sm file:mr-2 file:rounded-md file:border-0 file:bg-zinc-100 file:px-2 file:py-1.5 file:text-xs file:font-medium file:text-zinc-700" />
                        <button onClick={importHistoryHtml} className={`shrink-0 ${uix.btnDark} min-h-0 py-2`}>
                          HTML
                        </button>
                        <button
                          type="button"
                          onClick={() => void runHasekoEngineOnSelectedHtml()}
                          className={`shrink-0 rounded-md border border-teal-600 bg-teal-50 px-2.5 py-2 text-xs font-semibold text-teal-900 hover:bg-teal-100`}
                        >
                          网页执行分拣
                        </button>
                      </div>
                      <p className="text-xs text-zinc-500">见积登录 HTML，row_kbn 结构 · 选同一文件后点「网页执行分拣」生成 JSON（与 Node 脚本一致）</p>
                      <div id="section-haseko-engine" className="scroll-mt-8 rounded-lg border border-teal-200/80 bg-teal-50/50 p-3">
                        <details className="mb-3 rounded-md border border-teal-100 bg-white/70 px-3 py-2 text-xs leading-relaxed text-teal-950">
                          <summary className="cursor-pointer font-semibold text-teal-900">长谷工后端可能怎么做？（逆向推断）</summary>
                          <ol className="mt-2 list-decimal space-y-1.5 pl-5 text-teal-800/95">
                            <li>
                              浏览器把 <code className="rounded bg-teal-100/80 px-1">table#Costs</code> 全部以{" "}
                              <code className="rounded bg-teal-100/80 px-1">name=&quot;field[i]&quot;</code> 提交（POST / 保存ドラフト）。

                          <tr>
                            <th className="excel-cell excel-subhead">名称</th>
                            <th className="excel-cell excel-subhead">天井</th>
                            <th className="excel-cell excel-subhead">壁</th>
                            <th className="excel-cell excel-subhead">単位</th>
                            <th className="excel-cell excel-subhead">数量</th>
                            <th className="excel-cell excel-subhead">単価</th>
                            <th className="excel-cell excel-subhead">合計</th>
                            <th className="excel-cell excel-subhead">備考</th>
                          </tr>
                        </thead>
                        <tbody>
                          {crossDetailRows.map((r, i) => (
                            <tr key={`cross-paper-${i}`}>
                              <td className="excel-cell">{r[1] || ""}</td>
                              <td className="excel-cell text-right">{r[2] || ""}</td>
                              <td className="excel-cell text-right">{r[3] || ""}</td>
                              <td className="excel-cell">{r[4] || ""}</td>
                              <td className="excel-cell text-right">{r[5] || ""}</td>
                              <td className="excel-cell text-right">{r[6] ? currency(r[6]) : ""}</td>
                              <td className="excel-cell text-right">{r[7] ? currency(r[7]) : ""}</td>
                              <td className="excel-cell">{r[8] || ""}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  ) : null}

                  <div className="mt-3 border p-2">
                    <div>工期：お打合せにより</div>
                    <div>見積有効期限：３ヶ月間</div>
                    <div>精算状況：精算未合意</div>
                  </div>

                  <div className="mt-3">
                    <div className="font-semibold">&lt;&lt;備考&gt;&gt;</div>
                    <div className="min-h-20 border p-2 whitespace-pre-wrap">{projectInfo.memo || ""}</div>
                  </div>
                </section>
                {printPreviewCollapsed ? <p className="no-print text-center text-xs text-zinc-400">画面上已隐藏；「打印 / PDF」仍会输出本区块。</p> : null}
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
